name: Docker Build

on:
  push:
    branches:
      - main

#  schedule:
#    - cron: "0 1 * * *"

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: grobro-ker

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert repository owner to lowercase
        id: repo
        run: echo "owner_lc=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner_lc }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=tag
            type=sha
          labels: |
            org.opencontainers.image.title=GroBro-Ker
            org.opencontainers.image.description=Secure Mosquitto MQTT broker with integrated Certbot auto-renewal and automatic user provisioning.
            org.opencontainers.image.vendor=Benjamin Stark
            org.opencontainers.image.authors=Benjamin Stark
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
